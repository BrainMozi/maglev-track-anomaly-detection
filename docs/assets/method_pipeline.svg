<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="520" viewBox="0 0 1800 520">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7f9fc"/><stop offset="1" stop-color="#eef3f7"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#667085"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#243447" flood-opacity="0.12"/></filter>
    <style>
      .title{font:700 34px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#182230}.sub{font:400 20px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#475467}.num{font:700 22px 'Microsoft YaHei',sans-serif;fill:white}.boxTitle{font:700 25px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#182230}.boxSub{font:400 18px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#475467}
    </style>
  </defs>
  <rect width="1800" height="520" rx="28" fill="url(#bg)"/>
  <text x="70" y="68" class="title">最终主链：粗特征负责“发现”，高分辨率像素负责“边界”，区域判定器负责“去伪”</text>
  <text x="70" y="104" class="sub">固定机位轨面正则化后，仅学习正常分布；不训练未知异物类别。</text>
  <g filter="url(#shadow)">
    <rect x="70" y="165" width="245" height="215" rx="22" fill="#ffffff" stroke="#d0d5dd"/><circle cx="104" cy="200" r="20" fill="#344054"/><text x="97" y="208" class="num">1</text><text x="98" y="250" class="boxTitle">Canonical 正则化</text><text x="98" y="290" class="boxSub">冻结轨面映射</text><text x="98" y="322" class="boxSub">位置坐标对齐</text>
    <rect x="355" y="165" width="245" height="215" rx="22" fill="#ffffff" stroke="#b8c8df"/><circle cx="389" cy="200" r="20" fill="#315b8a"/><text x="382" y="208" class="num">2</text><text x="383" y="250" class="boxTitle">WRN 中层融合</text><text x="383" y="290" class="boxSub">正常记忆距离</text><text x="383" y="322" class="boxSub">连续异常热图</text>
    <rect x="640" y="165" width="245" height="215" rx="22" fill="#ffffff" stroke="#e2b878"/><circle cx="674" cy="200" r="20" fill="#b16d08"/><text x="667" y="208" class="num">3</text><text x="668" y="250" class="boxTitle">高阈值种子</text><text x="668" y="290" class="boxSub">只确认可靠异常</text><text x="668" y="322" class="boxSub">不连续控制边界</text>
    <rect x="925" y="165" width="245" height="215" rx="22" fill="#ffffff" stroke="#a7d5c4"/><circle cx="959" cy="200" r="20" fill="#18785a"/><text x="952" y="208" class="num">4</text><text x="953" y="250" class="boxTitle">像素正常差异</text><text x="953" y="290" class="boxSub">颜色/梯度 Median·MAD</text><text x="953" y="322" class="boxSub">位置 q90/q99 校准</text>
    <rect x="1210" y="165" width="245" height="215" rx="22" fill="#ffffff" stroke="#baa7d5"/><circle cx="1244" cy="200" r="20" fill="#6941a5"/><text x="1237" y="208" class="num">5</text><text x="1238" y="250" class="boxTitle">Graph Cut 细化</text><text x="1238" y="290" class="boxSub">种子硬约束</text><text x="1238" y="322" class="boxSub">像素 unary + Lab pairwise</text>
    <rect x="1495" y="165" width="235" height="215" rx="22" fill="#ffffff" stroke="#e2a6a6"/><circle cx="1529" cy="200" r="20" fill="#a33d3d"/><text x="1522" y="208" class="num">6</text><text x="1523" y="250" class="boxTitle">区域判定器</text><text x="1523" y="290" class="boxSub">证据特征去伪</text><text x="1523" y="322" class="boxSub">输出最终 mask</text>
  </g>
  <g stroke="#667085" stroke-width="4" fill="none" marker-end="url(#arrow)"><path d="M315 272 H345"/><path d="M600 272 H630"/><path d="M885 272 H915"/><path d="M1170 272 H1200"/><path d="M1455 272 H1485"/></g>
  <rect x="355" y="415" width="530" height="58" rx="18" fill="#eaf1f9"/><text x="383" y="451" class="sub" fill="#315b8a">鲁棒异常感知：决定“哪里值得怀疑”</text>
  <rect x="925" y="415" width="530" height="58" rx="18" fill="#e8f5f0"/><text x="953" y="451" class="sub" fill="#18785a">高分辨率边界恢复：决定“红区画到哪里”</text>
  <rect x="1495" y="415" width="235" height="58" rx="18" fill="#f8ecec"/><text x="1523" y="451" class="sub" fill="#a33d3d">候选级删除假响应</text>
</svg>
