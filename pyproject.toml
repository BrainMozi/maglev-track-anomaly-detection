[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maglev-track-anomaly-detection"
version = "0.1.0"
description = "Position-aware open-set anomaly detection for fixed-view maglev track imagery"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "Pillow>=10",
  "opencv-python>=4.8",
  "scikit-learn>=1.3",
  "PyMaxflow>=1.3",
  "joblib>=1.3"
]

[project.optional-dependencies]
inference = [
  "torch>=2.1",
  "torchvision>=0.16",
  "timm>=0.9",
  "ultralytics>=8.3"
]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
